<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 252 320" role="img" aria-label="Hyderabad Darbar logo">
  <rect width="252" height="320" fill="#F5A21B"/>
  <g fill="#8C1D18">
    <!-- crown band -->
    <path d="M46,98 Q126,88 206,98 L206,120 Q126,110 46,120 Z"/>
    <!-- side wings -->
    <path d="M46,100 C36,92 30,82 27,70 L33,68 C38,80 44,88 52,94 Z"/>
    <path d="M206,100 C216,92 222,82 225,70 L219,68 C214,80 208,88 200,94 Z"/>
    <!-- outer spikes -->
    <path d="M48,96 L54,74 L60,96 Z"/>
    <circle cx="54" cy="70" r="4"/>
    <path d="M192,96 L198,74 L204,96 Z"/>
    <circle cx="198" cy="70" r="4"/>
    <!-- medium spikes -->
    <path d="M96,94 L102,68 L108,94 Z"/>
    <circle cx="102" cy="64" r="4"/>
    <path d="M144,94 L150,68 L156,94 Z"/>
    <circle cx="150" cy="64" r="4"/>
    <!-- left trefoil -->
    <path d="M70,94 L78,62 L86,94 Z"/>
    <circle cx="78" cy="54" r="6.5"/>
    <circle cx="70" cy="60" r="4.5"/>
    <circle cx="86" cy="60" r="4.5"/>
    <!-- center trefoil -->
    <path d="M118,92 L126,50 L134,92 Z"/>
    <circle cx="126" cy="42" r="7.5"/>
    <circle cx="117" cy="48" r="5"/>
    <circle cx="135" cy="48" r="5"/>
    <!-- right trefoil -->
    <path d="M166,94 L174,62 L182,94 Z"/>
    <circle cx="174" cy="54" r="6.5"/>
    <circle cx="166" cy="60" r="4.5"/>
    <circle cx="182" cy="60" r="4.5"/>
  </g>
  <!-- band dots (knockouts) -->
  <g fill="#F5A21B">
    <circle cx="72" cy="97" r="5"/>
    <circle cx="99" cy="94" r="5"/>
    <circle cx="126" cy="93" r="6"/>
    <circle cx="153" cy="94" r="5"/>
    <circle cx="180" cy="97" r="5"/>
  </g>
  <!-- shield -->
  <path d="M60,134 H192 V222 C192,252 160,272 126,290 C92,272 60,252 60,222 Z"
        fill="none" stroke="#8C1D18" stroke-width="7" stroke-linejoin="round"/>
  <!-- monogram -->
  <text x="62" y="203" font-family="Georgia, 'Times New Roman', serif" font-weight="700" font-size="46" fill="#8C1D18">H</text>
  <text x="158" y="203" font-family="Georgia, 'Times New Roman', serif" font-weight="700" font-size="46" fill="#8C1D18">D</text>
  <!-- diamond -->
  <g fill="none" stroke="#8C1D18" stroke-width="3.5" stroke-linejoin="round">
    <path d="M112,166 H140 L152,186 H100 Z"/>
    <path d="M100,186 L126,214 L152,186"/>
    <path d="M112,166 L120,186 M140,166 L132,186 M120,186 L126,214 M132,186 L126,214"/>
  </g>
  <!-- sunburst above diamond -->
  <g stroke="#8C1D18" stroke-width="2.5" stroke-linecap="round">
    <line x1="126" y1="144" x2="126" y2="135"/>
    <line x1="129" y1="144" x2="130" y2="135"/>
    <line x1="123" y1="144" x2="122" y2="135"/>
    <line x1="134" y1="145" x2="137" y2="137"/>
    <line x1="118" y1="145" x2="115" y2="137"/>
    <line x1="139" y1="148" x2="144" y2="141"/>
    <line x1="113" y1="148" x2="108" y2="141"/>
    <line x1="143" y1="152" x2="150" y2="146"/>
    <line x1="109" y1="152" x2="102" y2="146"/>
  </g>
</svg>
